<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aqara G2H</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 18px;
      color: #222;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #666; line-height: 1.45; }
    label { display:block; font-weight:600; margin:18px 0 6px; }
    input {
      width:100%;
      box-sizing:border-box;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:16px;
    }
    .hint {
      font-size:13px;
      color:#777;
      margin-top:6px;
    }
    button {
      margin-top:22px;
      width:100%;
      padding:13px;
      border:0;
      border-radius:8px;
      font-size:16px;
      font-weight:600;
    }
  </style>
</head>
<body>
  <h1>Aqara G2H</h1>
  <p>
    Deze app gebruikt rechtstreeks de RTSP-stream van de camera.
    Er wordt geen Nest, Home Assistant, go2rtc of externe dienst gebruikt.
  </p>

  <label for="camera_name">Cameranaam</label>
  <input id="camera_name" value="Aqara G2H" autocomplete="off">

  <label for="rtsp_url">RTSP URL</label>
  <input id="rtsp_url"
         value="rtsp://192.168.1.100/ch0_0.h264"
         autocomplete="off"
         autocapitalize="none"
         spellcheck="false">

  <div class="hint">
    Voor de gehackte G2H RTSP-server is een veelgebruikte high-resolution URL:
    rtsp://CAMERA-IP/ch0_0.h264
  </div>

  <button id="next">Doorgaan</button>

  <script>
    const next = document.getElementById('next');

    next.addEventListener('click', async () => {
      const camera_name = document.getElementById('camera_name').value.trim();
      const rtsp_url = document.getElementById('rtsp_url').value.trim();

      if (!camera_name) {
        await Homey.alert('Vul een cameranaam in.');
        return;
      }

      if (!/^rtsp:\/\//i.test(rtsp_url)) {
        await Homey.alert('De RTSP URL moet beginnen met rtsp://');
        return;
      }

      next.disabled = true;
      Homey.showLoadingOverlay();

      try {
        await Homey.emit('validate', {
          camera_name,
          rtsp_url
        });

        await Homey.createDevice({
          name: camera_name,
          data: {
            id: rtsp_url
          },
          settings: {
            camera_name,
            rtsp_url
          }
        });

        await Homey.done();
      } catch (error) {
        Homey.hideLoadingOverlay();
        next.disabled = false;
        await Homey.alert(error?.message || String(error));
      }
    });
  </script>
</body>
</html>
