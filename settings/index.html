<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aqara Cameras</title>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px; }
    .card { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { line-height: 1.5; opacity: .8; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 11px 12px; border: 1px solid rgba(127,127,127,.45); border-radius: 8px; background: transparent; color: inherit; }
    button { margin-top: 22px; width: 100%; padding: 12px 16px; border: 0; border-radius: 8px; font-weight: 700; cursor: pointer; }
    #status { margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
    #status.error { display: block; background: rgba(220, 60, 60, .15); }
    #status.ok { display: block; background: rgba(50, 170, 90, .15); }
    .hint { font-size: 13px; opacity: .7; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Aqara Cameras</h1>
    <p>Vul hier de Aqara Developer gegevens in. Deze gegevens worden lokaal in Homey opgeslagen en worden niet naar GitHub gestuurd.</p>

    <label for="clientId">Aqara Client ID</label>
    <input id="clientId" type="text" autocomplete="off" spellcheck="false">

    <label for="clientSecret">Aqara Client Secret</label>
    <input id="clientSecret" type="password" autocomplete="off" spellcheck="false">

    <label for="keyId">Aqara Key ID</label>
    <input id="keyId" type="text" autocomplete="off" spellcheck="false">
    <div class="hint">Deze Key ID wordt gebruikt voor de Aqara API-signature.</div>

    <button id="save" type="button">Opslaan en configureren</button>
    <div id="status" role="status"></div>
  </main>

  <script>
    function onHomeyReady(Homey) {
      Homey.ready();

      const clientId = document.getElementById('clientId');
      const clientSecret = document.getElementById('clientSecret');
      const keyId = document.getElementById('keyId');
      const save = document.getElementById('save');
      const status = document.getElementById('status');

      const showStatus = (message, ok) => {
        status.textContent = message;
        status.className = ok ? 'ok' : 'error';
      };

      const setSetting = (key, value) => new Promise((resolve, reject) => {
        Homey.set(key, value, error => error ? reject(error) : resolve());
      });

      Promise.all([
        new Promise((resolve, reject) => Homey.get('aqara_client_id', (err, value) => err ? reject(err) : resolve(value))),
        new Promise((resolve, reject) => Homey.get('aqara_client_secret', (err, value) => err ? reject(err) : resolve(value))),
        new Promise((resolve, reject) => Homey.get('aqara_key_id', (err, value) => err ? reject(err) : resolve(value))),
      ]).then(([id, secret, key]) => {
        clientId.value = id || '';
        clientSecret.value = secret || '';
        keyId.value = key || '';
      }).catch(() => {});

      save.addEventListener('click', async () => {
        const id = clientId.value.trim();
        const secret = clientSecret.value.trim();
        const key = keyId.value.trim();

        if (!id || !secret || !key) {
          showStatus('Vul Client ID, Client Secret en Key ID in.', false);
          return;
        }

        save.disabled = true;
        try {
          await setSetting('aqara_client_id', id);
          await setSetting('aqara_client_secret', secret);
          await setSetting('aqara_key_id', key);

          const result = await Homey.api('POST', '/configure', {});
          showStatus(result.message || 'Aqara configuratie opgeslagen.', true);
        } catch (error) {
          console.error(error);
          showStatus(error.message || 'Opslaan/configureren mislukt.', false);
        } finally {
          save.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
