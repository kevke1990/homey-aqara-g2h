name: Generate camera images

on:
  push:
    paths:
      - '.github/workflows/generate-camera-images.yml'
      - 'assets/images/camera-icon.svg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install image tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin

      - name: Generate source SVG
        shell: bash
        run: |
          mkdir -p assets/images
          cat > assets/images/camera-icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
            <rect width="500" height="500" rx="70" fill="#f4f6f8"/>
            <rect x="75" y="155" width="350" height="205" rx="38" fill="#ffffff" stroke="#1f2937" stroke-width="14"/>
            <path d="M135 155l34-52h162l34 52" fill="#ffffff" stroke="#1f2937" stroke-width="14" stroke-linejoin="round"/>
            <circle cx="250" cy="257" r="78" fill="#e8edf2" stroke="#1f2937" stroke-width="14"/>
            <circle cx="250" cy="257" r="46" fill="#ffffff" stroke="#1f2937" stroke-width="11"/>
            <circle cx="250" cy="257" r="15" fill="#1f2937"/>
            <circle cx="365" cy="188" r="13" fill="#1f2937"/>
            <circle cx="250" cy="408" r="11" fill="#9ca3af"/>
          </svg>
          SVG

      - name: Generate PNG assets
        shell: bash
        run: |
          # Homey camera driver image requirements:
          # small = 75x75, large = 500x500
          rsvg-convert -w 75 -h 75 assets/images/camera-icon.svg -o assets/images/small.png
          rsvg-convert -w 500 -h 500 assets/images/camera-icon.svg -o assets/images/large.png

          identify assets/images/small.png assets/images/large.png
          test "$(identify -format '%wx%h' assets/images/small.png)" = "75x75"
          test "$(identify -format '%wx%h' assets/images/large.png)" = "500x500"

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/small.png assets/images/large.png assets/images/camera-icon.svg
          if git diff --cached --quiet; then
            echo "No image changes to commit."
            exit 0
          fi
          git commit -m "fix: use correct Homey camera image dimensions"
          git push
