name: Homey CI - Assets & Publish Validation

on:
  push:
    paths:
      - '.github/workflows/generate-camera-images.yml'
      - '.homeycompose/**'
      - 'drivers/**'
      - 'assets/icon.svg'
      - 'app.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homey-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Generate assets and validate Homey app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin libxml2-utils

      - name: Install Homey CLI
        run: npm install --global --no-optional homey

      - name: Generate application images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images .ci-assets

          cat > .ci-assets/app-image.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#173B9A"/>
                <stop offset="0.55" stop-color="#2F6BFF"/>
                <stop offset="1" stop-color="#19B5FE"/>
              </linearGradient>
              <radialGradient id="glow" cx="50%" cy="42%" r="55%">
                <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
                <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <rect width="1000" height="700" rx="72" fill="url(#bg)"/>
            <circle cx="760" cy="130" r="300" fill="url(#glow)"/>
            <path d="M0 560C190 470 315 620 510 540S805 430 1000 525V700H0Z" fill="#0D2467" fill-opacity="0.35"/>
            <g transform="translate(250 135)">
              <rect x="0" y="145" width="500" height="285" rx="62" fill="#FFFFFF" fill-opacity="0.96"/>
              <path d="M105 145l52-78h186l52 78" fill="#FFFFFF" fill-opacity="0.96"/>
              <circle cx="250" cy="285" r="108" fill="#DDE8FF"/>
              <circle cx="250" cy="285" r="67" fill="#FFFFFF"/>
              <circle cx="250" cy="285" r="23" fill="#173B9A"/>
              <circle cx="405" cy="190" r="18" fill="#19B5FE"/>
            </g>
            <g fill="#FFFFFF" fill-opacity="0.82">
              <circle cx="100" cy="115" r="5"/><circle cx="145" cy="170" r="3"/><circle cx="870" cy="270" r="5"/>
              <circle cx="915" cy="210" r="3"/><circle cx="790" cy="520" r="4"/>
            </g>
          </svg>
          SVG

          rsvg-convert -w 250 -h 175 .ci-assets/app-image.svg -o assets/images/small.png
          rsvg-convert -w 500 -h 350 .ci-assets/app-image.svg -o assets/images/large.png
          rsvg-convert -w 1000 -h 700 .ci-assets/app-image.svg -o assets/images/xlarge.png

      - name: Generate camera driver images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p drivers/camera/assets/images .ci-assets

          cat > .ci-assets/driver-image.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
            <defs>
              <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#FFFFFF"/>
                <stop offset="1" stop-color="#E8EDF4"/>
              </linearGradient>
              <radialGradient id="lens" cx="35%" cy="30%" r="70%">
                <stop offset="0" stop-color="#8FB7FF"/>
                <stop offset="0.5" stop-color="#2F6BFF"/>
                <stop offset="1" stop-color="#102A68"/>
              </radialGradient>
            </defs>
            <rect width="1000" height="1000" fill="#FFFFFF"/>
            <ellipse cx="500" cy="800" rx="285" ry="42" fill="#D7DCE5" opacity="0.65"/>
            <g transform="translate(160 135)">
              <path d="M145 205l95-120h200l95 120" fill="url(#body)" stroke="#172033" stroke-width="18" stroke-linejoin="round"/>
              <path d="M100 205h580v390c0 74-60 134-134 134H234c-74 0-134-60-134-134z" fill="url(#body)" stroke="#172033" stroke-width="18"/>
              <circle cx="390" cy="395" r="150" fill="#DCE7FF" stroke="#172033" stroke-width="18"/>
              <circle cx="390" cy="395" r="105" fill="url(#lens)" stroke="#172033" stroke-width="14"/>
              <circle cx="350" cy="350" r="28" fill="#FFFFFF" opacity="0.72"/>
              <circle cx="610" cy="280" r="20" fill="#19B5FE"/>
              <circle cx="390" cy="680" r="10" fill="#98A2B3"/>
              <path d="M205 730h370" stroke="#CBD2DD" stroke-width="12" stroke-linecap="round"/>
            </g>
          </svg>
          SVG

          rsvg-convert -w 75 -h 75 .ci-assets/driver-image.svg -o drivers/camera/assets/images/small.png
          rsvg-convert -w 500 -h 500 .ci-assets/driver-image.svg -o drivers/camera/assets/images/large.png
          rsvg-convert -w 1000 -h 1000 .ci-assets/driver-image.svg -o drivers/camera/assets/images/xlarge.png

      - name: Validate every required image
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "assets/images/small.png:250x175"
            "assets/images/large.png:500x350"
            "assets/images/xlarge.png:1000x700"
            "drivers/camera/assets/images/small.png:75x75"
            "drivers/camera/assets/images/large.png:500x500"
            "drivers/camera/assets/images/xlarge.png:1000x1000"
          )

          for entry in "${required[@]}"; do
            file="${entry%%:*}"
            expected="${entry##*:}"
            test -s "$file"
            actual="$(identify -format '%wx%h' "$file")"
            echo "$file -> $actual (expected $expected)"
            test "$actual" = "$expected"
          done

          test -s assets/icon.svg
          test -s drivers/camera/assets/icon.svg
          xmllint --noout assets/icon.svg
          xmllint --noout drivers/camera/assets/icon.svg

      - name: Compose Homey manifest
        run: homey app compose

      - name: Validate Homey app at publish level
        run: homey app validate --level publish

      - name: Commit generated assets and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add app.json \
            assets/images/small.png \
            assets/images/large.png \
            assets/images/xlarge.png \
            drivers/camera/assets/images/small.png \
            drivers/camera/assets/images/large.png \
            drivers/camera/assets/images/xlarge.png

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "chore: generate Homey assets and manifest"
          git push origin HEAD:main
