name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run unit tests
        run: npm test
